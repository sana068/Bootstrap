<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Classes</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        span{
            display: inline-block;
            height: 80px;
            width: 80px;
            margin: 8px;
            background-color: blueviolet;
        }
        body{
            background-color: grey;
        }
    </style>
</head>
<body>
    <div class="container mt-3">
                     
               <!-- border width -->

        <div class="border mb-5 p-5">
        <span class="border border-1"></span>
        <span class="border border-2"></span>
        <span class="border border-3"></span>
        <span class="border border-4"></span>
        <span class="border border-5"></span>
        </div>
        
               <!-- border classes -->

        <div class="border mb-5 p-5">
        <span class="border border-5 border-top-0"></span>
        <span class="border border-5  border-bottom-0"></span>
        <span class="border border-5  border-start-0"></span>
        <span class="border border-5  border-end-0"></span>
        </div>
       
                       <!-- border color -->

         <div class="border mb-5 p-5">
         <span class="border border-5 border-primary"></span>
         <span class="border border-5 border-secondary"></span>
         <span class="border border-5 border-success"></span>
         <span class="border border-5 border-warning"></span>
         <span class="border border-5 border-info"></span>
         <span class="border border-5 border-danger"></span>
         <span class="border border-5 border-light"></span>
         </div>

               <!-- border radius -->

             <div class="border mb-5 p-5">
            <span class="border border-5 rounded-top"></span>
            <span class="border border-5 rounded-bottom"></span>
            <span class="border border-5 rounded-end"></span>
            <span class="border border-5 rounded-start"></span>
            <span class="border border-5 rounded-pill"></span>
            <span class="border border-5 rounded-circle"></span>
            <span class="border border-5 rounded-0"></span>
            <span class="border border-5 rounded-1"></span>
            <span class="border border-5 rounded-2"></span>
            <span class="border border-5 rounded-3"></span>
            <span class=" w-50 border border-5 rounded-pill"></span>
            <span class="w-50 border border-5 rounded-circle"></span>
             </div>

    </div>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
