<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Button-Group In Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">

                <!-- Button-Group -->

         <div class="border mb-5 mt-4 p-3">
        <div class="btn-group">
            <button class="btn btn-primary">Home</button>
            <button class="btn btn-secondary">About</button>
            <button class="btn btn-warning">Contact</button>
        </div>
         </div>

                 <!-- Button Sizes -->

                   <div class="border p-3 ">
         <div class="btn-group btn-group-sm mb-3 ">
            <button class="btn btn-primary">Home</button>
            <button class="btn btn-secondary">About</button>
            <button class="btn btn-warning">Contact</button>
        </div>

        <div class="btn-group btn-group-md mb-3">
            <button class="btn btn-primary">Home</button>
            <button class="btn btn-secondary">About</button>
            <button class="btn btn-warning">Contact</button>
        </div>

        <div class="btn-group btn-group-lg mb-3">
            <button class="btn btn-primary">Home</button>
            <button class="btn btn-secondary">About</button>
            <button class="btn btn-warning">Contact</button>
        </div>
    </div>

                 <!-- link button group -->

                 <div class="border p-3 mb-5">
                 <div class="btn-group">
                    <a href="#" class="btn btn-primary">Button 1</a>
                    <a href="#" class="btn btn-secondary">Button 2</a>
                    <a href="#" class="btn btn-warning">Button 3</a>
                 </div>
                 </div>

                 <!-- Vertical Button -->

         <div class="border mb-5  p-3">
        <div class="btn-group btn-group-vertical">
            <button class="btn btn-primary">Home</button>
            <button class="btn btn-secondary">About</button>
            <button class="btn btn-warning">Contact</button>
        </div>
         </div>

           <!-- Side by side button -->

          <div class="border mb-5  p-3">
        <div class="btn-group">
            <button class="btn btn-primary rounded-pill">Home</button>
            <button class="btn btn-secondary rounded-pill">About</button>
            <button class="btn btn-warning rounded-pill">Contact</button>
        </div>

         <div class="btn-group">
            <button class="btn btn-outline-primary">Home</button>
            <button class="btn btn-outline-secondary">About</button>
            <button class="btn btn-outline-warning">Contact</button>
        </div>

         <div class="btn-group">
            <button class="btn btn-outline-primary rounded-pill">Home</button>
            <button class="btn btn-outline-secondary rounded-pill">About</button>
            <button class="btn btn-outline-warning rounded-pill">Contact</button>
        </div>
         </div>

    </div>
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
