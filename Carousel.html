<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">

        <!-- carousel slide -->
         
           <div class="carousel slide carousel-fade mt-2 mb-5" id="demo" data-bs-ride="carousel">

            <div class="carousel-indicators">
               <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
               <button type="button" data-bs-target="#demo" data-bs-slide-to="1" class="active"></button>  
               <button type="button" data-bs-target="#demo" data-bs-slide-to="2" class="active"></button>  
              
            </div>
             
            <div class="carousel-inner">
                 <div class="carousel-item active">
                    <img src="img 2.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 1</h3>
                      <p> This Is My First Slide</p>  
                    </div>
                 </div>
                 <div class="carousel-item">
                    <img src="img 1.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 2</h3>
                      <p> This Is My Second Slide</p>  
                    </div>
                 </div>
                 <div class="carousel-item">
                    <img src="img 3.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 3</h3>
                      <p> This Is My Third Slide</p>  
                    </div>
                 </div>
                 
            </div>
              
            <button type="button" class="carousel-control-prev" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            </button>

            <button type="button" class="carousel-control-next" data-bs-target="#demo" data-bs-slide="next">
             <span class="carousel-control-next-icon"></span>
            </button>
           </div>

           <!-- carousel interval -->

           <div class="carousel slide  mb-5" id="demo" data-bs-ride="carousel">

            <div class="carousel-indicators">
               <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
               <button type="button" data-bs-target="#demo" data-bs-slide-to="1" class="active"></button>  
               <button type="button" data-bs-target="#demo" data-bs-slide-to="2" class="active"></button>  
              
            </div>
             
            <div class="carousel-inner">
                 <div class="carousel-item active">
                    <img src="img 2.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 1</h3>
                      <p> This Is My First Slide</p>  
                    </div>
                 </div>
                 <div class="carousel-item" data-bs-interval="3000">
                    <img src="img 1.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 2</h3>
                      <p> This Is My Second Slide</p>  
                    </div>
                 </div>
                 <div class="carousel-item" data-bs-interval="5000">
                    <img src="img 3.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 3</h3>
                      <p> This Is My Third Slide</p>  
                    </div>
                 </div>
                 
            </div>
              
            <button type="button" class="carousel-control-prev" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            </button>

            <button type="button" class="carousel-control-next" data-bs-target="#demo" data-bs-slide="next">
             <span class="carousel-control-next-icon"></span>
            </button>
           </div>

           <!-- carousel dark -->
                   
           <div class="carousel slide carousel-dark mt-2 mb-5" id="demo" data-bs-ride="carousel">

            <div class="carousel-indicators">
               <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
               <button type="button" data-bs-target="#demo" data-bs-slide-to="1" class="active"></button>  
               <button type="button" data-bs-target="#demo" data-bs-slide-to="2" class="active"></button>  
              
            </div>
             
            <div class="carousel-inner">
                 <div class="carousel-item active">
                    <img src="img 2.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 1</h3>
                      <p> This Is My First Slide</p>  
                    </div>
                 </div>
                 <div class="carousel-item">
                    <img src="img 1.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 2</h3>
                      <p> This Is My Second Slide</p>  
                    </div>
                 </div>
                 <div class="carousel-item">
                    <img src="img 3.jpeg" class="d-block w-100" alt="">
                    <div class="carousel-caption">
                      <h3>Slide 3</h3>
                      <p> This Is My Third Slide</p>  
                    </div>
                 </div>
                 
            </div>
              
            <button type="button" class="carousel-control-prev" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            </button>

            <button type="button" class="carousel-control-next" data-bs-target="#demo" data-bs-slide="next">
             <span class="carousel-control-next-icon"></span>
            </button>
           </div>

    </div>
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
