<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images Bootstrap </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body class="bg-secondary">
      <div class="container">
        <div class="row mt-2">
            <div class="col-md-12">
                <img src="penguin.jpg" class="rounded" height="300" width="300" alt="">
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12">
                <img src="penguin.jpg" class="rounded-circle" height="300" width="300" alt="">
            </div>
        </div>
         <div class="row mt-2">
            <div class="col-md-12">
                <img src="penguin.jpg" class="img-thumbnail" height="300" width="300" alt="">
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12">
                <img src="penguin.jpg" class="float-start" height="300" width="300" alt="">
                <img src="penguin.jpg" class="float-end" height="300" width="300" alt="">
            </div>
        <div class="row mt-2">
            <div class="col-md-12">
                <img src="penguin.jpg" class="mx-auto d-block" height="300" width="300" alt="">
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-4">
                <img src="penguin.jpg" class="img-fluid" alt="">
            </div>
            <div class="col-md-4">
                <img src="penguin.jpg" class="img-fluid" alt="">
            </div>
            <div class="col-md-4">
                <img src="penguin.jpg" class="img-fluid" alt="">
            </div>
      </div> 
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
<!-- classes
 • Rounded → top , bottom 
 •  Circle
 •  Thumbnail
 •  Aligning Images → float-start → left , float-end → right , mx-auto d-block → center 
 •   Responsive images → img-fluid
  -->
