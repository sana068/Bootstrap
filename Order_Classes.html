<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offset Classes</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        
        <div class="row border mb-5 ">
            <div class="col-md-3 bg-primary p-3">
           <h2>Div 1</h2>
            </div>
             <div class="col-md-3 bg-danger p-3 order-last">
           <h2>Div 2</h2>
            </div>
             <div class="col-md-3 bg-warning p-3">
           <h2>Div 3</h2>
            </div>
             <div class="col-md-3 bg-success p-3 order-first">
           <h2>Div 4</h2>
            </div>

        </div>

        <!-- order classes size -->

        <div class="row border mb-5">

            <div class="col-md-3 bg-primary p-3 order-md-last order-sm-last">
           <h2>Div 1</h2>
            </div>
             <div class="col-md-3 bg-danger p-3">
           <h2>Div 2</h2>
            </div>
             <div class="col-md-3 bg-warning p-3">
           <h2>Div 3</h2>
            </div>
             <div class="col-md-3 bg-success p-3 order-md-first order-sm-first">
           <h2>Div 4</h2>
            </div>

        </div>

        <!-- order classes number -->

         <div class="row border mb-5 ">
            <div class="col-md-3 bg-primary p-3 order-3">
           <h2>Div 1</h2>
            </div>
             <div class="col-md-3 bg-danger p-3 order-2">
           <h2>Div 2</h2>
            </div>
             <div class="col-md-3 bg-warning p-3 order-1">
           <h2>Div 3</h2>
            </div>
             <div class="col-md-3 bg-success p-3 order-0">
           <h2>Div 4</h2>
            </div>

        </div>

    </div>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
