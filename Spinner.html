<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinners </title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
             <!-- spinner/loader  border -->
              
              <div class="border p-3 mt-3 mb-5 text-center">
        <div class="spinner-border text-primary"></div>
        <div class="spinner-border text-secconday"></div>
        <div class="spinner-border text-danger"></div>
        <div class="spinner-border text-warning"></div>
        <div class="spinner-border text-success"></div>
        <div class="spinner-border text-dark"></div>
        <div class="spinner-border text-info"></div>
              </div>

            <!-- spinner/loader grow   -->

                <div class="border p-3 mb-5 text-center">
        <div class="spinner-grow text-primary"></div>
        <div class="spinner-grow text-secconday"></div>
        <div class="spinner-grow text-danger"></div>
        <div class="spinner-grow text-warning"></div>
        <div class="spinner-grow text-success"></div>
        <div class="spinner-grow text-dark"></div>
        <div class="spinner-grow text-info"></div>
              </div> 

                  <!-- spinner/loader  border sizes  -->

              <!-- spinner/loader border ,spinner/loader grow size sm -->

              <div class="border p-3  mb-5 text-center">
        <div class="spinner-border text-primary spinner-border-sm"></div>
        <div class="spinner-border text-secconday spinner-border-sm"></div>
        <div class="spinner-border text-danger spinner-border-sm"></div>
        <div class="spinner-border text-warning  spinner-border-sm"></div>
        <div class="spinner-border text-success spinner-border-sm"></div>
        <div class="spinner-border text-dark spinner-border-sm"></div>
        <div class="spinner-border text-info spinner-border-sm "></div>

        <div class="spinner-grow text-primary spinner-grow-sm "></div>
        <div class="spinner-grow text-secconday spinner-grow-sm"></div>
        <div class="spinner-grow text-danger spinner-grow-sm"></div>
        <div class="spinner-grow text-warning spinner-grow-sm"></div>
        <div class="spinner-grow text-success spinner-grow-sm"></div>
        <div class="spinner-grow text-dark spinner-grow-sm"></div>
        <div class="spinner-grow text-info spinner-grow-sm"></div>
              </div>
    
              <!-- spinner/loader border ,spinner/loader grow size md -->

              <div class="border p-4  mb-5 text-center">
        <div class="spinner-border text-primary spinner-border-md"></div>
        <div class="spinner-border text-seccondayspinner-border-md"></div>
        <div class="spinner-border text-danger spinner-border-md"></div>
        <div class="spinner-border text-warning  spinner-border-md"></div>
        <div class="spinner-border text-success spinner-border-md"></div>
        <div class="spinner-border text-dark spinner-border-md"></div>
        <div class="spinner-border text-info spinner-border-md"></div>
           
        <div class="spinner-grow text-primary spinner-grow-md"></div>
        <div class="spinner-grow text-secconday spinner-grow-md"></div>
        <div class="spinner-grow text-danger spinner-grow-md"></div>
        <div class="spinner-grow text-warning spinner-grow-md"></div>
        <div class="spinner-grow text-success spinner-grow-md"></div>
        <div class="spinner-grow text-dark spinner-grow-md"></div>
        <div class="spinner-grow text-info spinner-grow-md"></div>
              </div>
              
                            <!-- spinner button border -->

                   <div class="border p-3  mb-5 text-center">
                  <button type="button" class="btn btn-primary" >Loading..<span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-secondary" >Loading..<span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-danger" >Loading..<span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-warning" >Loading..<span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-success" >Loading..<span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-dark" >Loading..<span class="spinner-border spinner-border-sm"></span></button>
                   <button type="button" class="btn btn-info" >Loading..<span class="spinner-border spinner-border-sm"></span></button>
                 </div>

                   <!-- spinner button grow -->

                 <div class="border p-3  mb-5 text-center">
                  <button type="button" class="btn btn-primary" >Loading..<span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-secondary" >Loading..<span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-danger" >Loading..<span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-warning" >Loading..<span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-success" >Loading..<span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-dark" >Loading..<span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-info" >Loading..<span class="spinner-grow spinner-grow-sm"></span></button>
                  </div>

               <!-- spinner button border -->

                   <div class="border p-3  mb-5 text-center">
                  <button type="button" class="btn btn-primary" ><span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-secondary" ><span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-danger" ><span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-warning" ><span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-success" ><span class="spinner-border spinner-border-sm"></span></button>
                  <button type="button" class="btn btn-dark" ><span class="spinner-border spinner-border-sm"></span></button>
                   <button type="button" class="btn btn-info" ><span class="spinner-border spinner-border-sm"></span></button>
                 </div>

                   <!-- spinner button grow -->

                 <div class="border p-3  mb-5 text-center">
                  <button type="button" class="btn btn-primary"><span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-secondary"><span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-danger"><span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-warning"><span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-success" ><span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-dark" ><span class="spinner-grow spinner-grow-sm"></span></button>
                  <button type="button" class="btn btn-info" ><span class="spinner-grow spinner-grow-sm"></span></button>
                  </div>

    </div>
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
