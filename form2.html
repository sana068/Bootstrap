<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-3">

        <!-- select menu -->

         <div class="row">
            <div class="col-sm-4">
              <label for="" class="form-label">Select Game:</label>
              <select name="" id="" class="form-select">
                <option value="">Select</option>
                <option value="PuBG">PuBG</option>
                <option value="GTA">GTA</option>
                <option value="Need For Speed">Need For Speed</option>
                <option value="Takken 7">Takken 7</option>
              </select> 
              <br> 
                         
              <!-- multiple selection  -->

              <label for="" class="form-label">Select Game:</label>
              <select name="" id="" class="form-select" multiple>
                <option value="">Select</option>
                <option value="PuBG">PuBG</option>
                <option value="GTA">GTA</option>
                <option value="Need For Speed">Need For Speed</option>
                <option value="Takken 7">Takken 7</option>
              </select><br>

              <!-- menu selection size  -->

              <label for="" class="form-label">Select Game:</label>
              <select name="" id="" class="form-select form-select-lg">
                <option value="">Select</option>
                <option value="PuBG">PuBG</option>
                <option value="GTA">GTA</option>
                <option value="Need For Speed">Need For Speed</option>
                <option value="Takken 7">Takken 7</option>
              </select>  
              <br>
              <label for="" class="form-label">Select Game:</label>
              <select name="" id="" class="form-select">
                <option value="">Select</option>
                <option value="PuBG">PuBG</option>
                <option value="GTA">GTA</option>
                <option value="Need For Speed">Need For Speed</option>
                <option value="Takken 7">Takken 7</option>
              </select> 
              <br>
              <label for="" class="form-label">Select Game:</label>
              <select name="" id="" class="form-select form-select-sm">
                <option value="">Select</option>
                <option value="PuBG">PuBG</option>
                <option value="GTA">GTA</option>
                <option value="Need For Speed">Need For Speed</option>
                <option value="Takken 7">Takken 7</option>
              </select><br>  
              
              <!-- disabled -->

               <label for="" class="form-label">Select Game:</label>
              <select name="" id="" class="form-select" disabled>
                <option value="">Select</option>
                <option value="PuBG">PuBG</option>
                <option value="GTA">GTA</option>
                <option value="Need For Speed">Need For Speed</option>
                <option value="Takken 7">Takken 7</option>
              </select> 
              <br>

              <!-- data list  -->

               <label for="" class="form-label">Select Fruit:</label>
               <input list="fruits" class="form-control">
               <datalist id="fruits">
                <option value="Apple">Apple</option>
                <option value="Mango">Mango</option>
                <option value="Apricot">Apricot</option>
                <option value="Grapes">Grapes</option>
                <option value="Orange">Orange</option>
                </datalist>
            </div>
         </div>

    </div>
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
