<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 3</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
 <div class="row">
 <div class="col-sm-4">
      <form action="">
        <label for="">Select Hobbies</label>
        <div class="form-check">
        <input type="checkbox" value="Swimming" class="form-check-input" name="hobbies" checked>
        <label for="" class="form-check">Swimming</label>
      </div>
       <div class="form-check">
        <input type="checkbox" value="Dancing" class="form-check-input" name="hobbies">
        <label for="" class="form-check">Dancing</label>
      </div>
       <div class="form-check">
        <input type="checkbox" value="Singing" class="form-check-input" name="hobbies">
        <label for="" class="form-check">Singing</label>
      </div>
       <div class="form-check">
        <input type="checkbox" value="Cricket" class="form-check-input" name="hobbies">
        <label for="" class="form-check">Cricket</label>
      </div>
       <div class="form-check">
        <input type="checkbox" value="Planting" class="form-check-input" name="hobbies">
        <label for="" class="form-check">Planting</label>
      </div>
      </form><br>

      <!-- radio button -->

       <label for="">Select Gender</label>
        <div class="form-check">
        <input type="radio"  class="form-check-input" value="Male" name="gender">
        <label for="" class="form-check">Male</label>
      </div>
      <div class="form-check">
        <input type="radio"  class="form-check-input" value="Female" name="gender">
        <label for="" class="form-check">Female</label>
      </div><br>

      <!-- toggle switch dark mode -->

            <div class="form-check form-switch">
        <input type="checkbox" value="darkmode" class="form-check-input" name="darkmode">
        <label for="" class="form-check">Dark Theme</label>
      </div><br>

      <!-- range -->

       <label for="" class="form-label">Volume</label>
       <input type="range" name="" id="" class="form-range"><br>

       <!-- range in step  -->
       
       <label for="" class="form-label">Volume</label>
       <input type="range" name="" id="" class="form-range" step="10"><br>

       <!-- min and max -->

       <label for="" class="form-label">Volume</label>
       <input type="range" name="" id="" class="form-range" min="0" max="5"><br>

</div>
 </div>

    </div>
    <script src="js/bootstrap.min.js"></script>
</body>
</html>

     maximum = 100 -->
