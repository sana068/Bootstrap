<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">

        <!-- basic progress bar -->
       
        <div class="border p-5 mb-4">
        <div class="progress mt-4" style="height: 30px;">
            <div class="progress-bar" style="width: 60%; height: 30px;">
            </div>
        </div>

            <div class="progress mt-4" style="height: 30px;">
            <div class="progress-bar" style="width: 90%; height: 30px;">
            </div>
        </div>

        <div class="progress mt-4" style="height: 30px;">
            <div class="progress-bar" style="width: 30%; height: 30px;">
            </div>
        </div>

        <div class="progress mt-4" style="height: 30px;">
            <div class="progress-bar" style="width: 70%; height: 30px;">
            </div>
        </div>

        <div class="progress mt-4" style="height: 30px;">
            <div class="progress-bar" style="width: 20%; height: 30px;">
            </div>
        </div>
        
        <div class="progress mt-4" style="height: 30px;">
            <div class="progress-bar" style="width: 50%;height: 30px;">
            </div>
        </div>

        </div>

                      <!--  progress bar labels -->

                     <div class="border p-5 mb-4">

                     <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar" style="width: 60%; height: 25px;">
                60%
            </div>
        </div>

            <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar" style="width: 90%; height: 25px;">
                90%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar" style="width: 30%; height: 25px;">
                30%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar" style="width: 80%; height: 25px;">
                80%
            </div>
        </div>

        <div class="progress mt-4">
            <div class="progress-bar" style="width: 20%; height: 25px;">
                20%
            </div>
        </div>
        
        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar" style="width: 50%; height: 25px;">
                50%
            </div>
        </div>  
       
        </div>   


         <!--  progress bar color -->

                     <div class="border p-5 mb-4">

                     <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-primary" style="width: 60%; height: 25px;">
                60%
            </div>
        </div>

            <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-dark" style="width: 90%; height: 25px;">
                90%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-success" style="width: 30%; height: 25px;">
                30%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-info" style="width: 80%; height: 25px;">
                80%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-danger" style="width: 20%; height: 25px;">
                20%
            </div>
        </div>
        
        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-warning" style="width: 50%; height: 25px;">
                50%
            </div>
        </div>  
       
        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-secondary" style="width: 38%; height: 25px;">
                38%
            </div>
        </div>  
        </div>  

        <!--  progress bar color striped -->

                     <div class="border p-5 mb-4">

                     <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-primary progress-bar-striped" style="width: 60%; height: 25px;">
                60%
            </div>
        </div>

            <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-dark  progress-bar-striped" style="width: 90%; height: 25px;">
                90%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-success  progress-bar-striped" style="width: 30%; height: 25px;">
                30%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-info  progress-bar-striped" style="width: 80%; height: 25px;">
                80%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-danger  progress-bar-striped" style="width: 20%; height: 25px;">
                20%
            </div>
        </div>
        
        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-warning progress-bar-striped" style="width: 50%; height: 25px;">
                50%
            </div>
        </div>  
       
        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-secondary  progress-bar-striped" style="width: 38%; height: 25px;">
                38%
            </div>
        </div>  
        </div>
                
         <!--  progress bar  striped-animated -->

                     <div class="border p-5 mb-4">

                     <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" style="width: 60%; height: 25px;">
                60%
            </div>
        </div>

            <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-dark  progress-bar-striped progress-bar-animated" style="width: 90%; height: 25px;">
                90%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-success  progress-bar-striped progress-bar-animated" style="width: 30%; height: 25px;">
                30%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-info  progress-bar-striped progress-bar-animated" style="width: 80%; height: 25px;">
                80%
            </div>
        </div>

        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-danger  progress-bar-striped progress-bar-animated" style="width: 20%; height: 25px;">
                20%
            </div>
        </div>
        
        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width: 50%; height: 25px;">
                50%
            </div>
        </div>  
       
        <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-secondary  progress-bar-striped progress-bar-animated" style="width: 38%; height: 25px;">
                38%
            </div>
        </div>  
        </div>

        <!-- progress bar stacked -->

          <div class="border p-5 mb-4">

                     <div class="progress mt-4" style="height: 25px;">
            <div class="progress-bar bg-primary" style="width: 40%; height: 25px;">
                40% Phone Storage
            </div>
            <div class="progress-bar bg-danger" style="width: 30%; height: 25px;">
                30% Free Storage
            </div>
            <div class="progress-bar bg-success" style="width: 20%; height: 25px;">
                20% Sd Card Storage
            </div>
                     </div>
           </div>

    </div>
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
